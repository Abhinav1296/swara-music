# Build the Swara Android APK in the cloud — NO local Android Studio / SDK needed.
#
# Run it:  GitHub repo → Actions tab → "Build Android APK" → Run workflow.
# The api_base field already defaults to the live backend
# (https://swara-backend-9kra.onrender.com/api) — just leave it and click Run.
# When it finishes, download the "swara-debug-apk" artifact and send it to phones.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend API base URL. Defaults to the live Swara backend; leave as-is for a normal build."
        required: false
        default: "https://swara-backend-9kra.onrender.com/api"
      live_reload_url:
        description: "OPTIONAL live-reload: your dev server URL (e.g. http://192.168.1.2:5173). Fill this to get an APK that loads the LIVE dev server (phone must be on the same Wi-Fi, dev server running). Leave EMPTY for a normal standalone APK."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Capacitor 8's CLI requires Node >= 22 (`npx cap sync` fails on 20).
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Capacitor 8 (AGP 8.13 / Gradle 8.14 / compileSdk 36) requires JDK 21.
      # Building with JDK 17 fails the Gradle step with exit code 1.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps & build web
        working-directory: frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_BASE: ${{ github.event.inputs.api_base }}
          VITE_GOOGLE_CLIENT_ID: "398262049439-05f556d8doi820o3d3c365cmsi0dtsfl.apps.googleusercontent.com"

      # LIVE-RELOAD (opt-in): if a dev URL was provided, point the app at it.
      # This makes the WebView load the running dev server instead of the bundled
      # web assets, so every code edit shows up live in the real native shell.
      # Runs BEFORE cap sync so the server config is copied into the Android
      # project (and Capacitor auto-adds usesCleartextTraffic for the http URL).
      # This ONLY happens when the live_reload_url field is filled at run time —
      # the committed config stays production-clean.
      - name: Enable live-reload (optional)
        if: ${{ github.event.inputs.live_reload_url != '' }}
        working-directory: frontend
        env:
          LR_URL: ${{ github.event.inputs.live_reload_url }}
        run: |
          node -e "
            const fs = require('fs');
            const p = 'capacitor.config.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.server = Object.assign({}, c.server, { url: process.env.LR_URL, cleartext: true });
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log('Live-reload enabled -> server.url =', c.server.url);
          "

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      # Turn a single logo (frontend/assets/icon.png, 1024x1024) into every
      # Android launcher-icon density + adaptive icon. No-op until you add the
      # file, so the build stays green either way.
      - name: Apply app icon (if a logo is provided)
        working-directory: frontend
        run: |
          if [ -f assets/icon.png ]; then
            echo "Found assets/icon.png — generating Android launcher icons."
            npx @capacitor/assets generate --android
          else
            echo "No assets/icon.png provided — using the default Capacitor icon."
          fi

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swara-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
