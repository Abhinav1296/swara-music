# Build the Swara Android APK in the cloud — NO local Android Studio / SDK needed.
#
# Run it:  GitHub repo → Actions tab → "Build Android APK" → Run workflow.
# Optionally paste your Render backend URL so the app has data:
#   api_base = https://<your-service>.onrender.com/api
# When it finishes, download the "swara-debug-apk" artifact and send it to phones.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend API base URL (e.g. https://swara-backend.onrender.com/api). Leave blank for a UI-only build."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps & build web
        working-directory: frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_BASE: ${{ github.event.inputs.api_base }}
          VITE_GOOGLE_CLIENT_ID: "398262049439-05f556d8doi820o3d3c365cmsi0dtsfl.apps.googleusercontent.com"

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swara-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
